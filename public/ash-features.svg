<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#030014"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Ash — Personal AI OS</text>
  
  <!-- Central Node -->
  <g>
    <!-- Circle background -->
    <ellipse cx="600" cy="400" rx="100" ry="80" fill="#2d1b69" stroke="#7c3aed" stroke-width="3"/>
    <!-- Text -->
    <text x="600" y="390" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Ash</text>
    <text x="600" y="415" font-size="14" fill="#c4b5fd" text-anchor="middle">personal AI OS</text>
  </g>
  
  <!-- Top Left: Canvas Deadlines -->
  <g>
    <rect x="80" y="100" width="240" height="100" rx="20" fill="#6b4423" stroke="#a0743d" stroke-width="2"/>
    <text x="200" y="145" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Canvas deadlines</text>
    <text x="200" y="175" font-size="13" fill="#e8d4c4" text-anchor="middle">iCal • urgency sort</text>
    <!-- Connection line -->
    <line x1="320" y1="150" x2="500" y2="350" stroke="#a0743d" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Top Center: AI Assistant -->
  <g>
    <!-- Gradient for this box -->
    <defs>
      <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#1a5f4f;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#2d8659;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="480" y="80" width="240" height="100" rx="20" fill="url(#aiGradient)" stroke="#4a9d6f" stroke-width="2"/>
    <text x="600" y="125" font-size="20" font-weight="bold" fill="white" text-anchor="middle">AI assistant</text>
    <text x="600" y="155" font-size="13" fill="#c4ede0" text-anchor="middle">voice + text • Gemini</text>
    <!-- Connection line -->
    <line x1="600" y1="180" x2="600" y2="320" stroke="#4a9d6f" stroke-width="3"/>
  </g>
  
  <!-- Top Right: Grade Tracker -->
  <g>
    <rect x="880" y="100" width="240" height="100" rx="20" fill="#0f3a5f" stroke="#2e5a8f" stroke-width="2"/>
    <text x="1000" y="145" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Grade tracker</text>
    <text x="1000" y="175" font-size="13" fill="#a8c5e0" text-anchor="middle">GPA • projections</text>
    <!-- Connection line -->
    <line x1="880" y1="150" x2="700" y2="350" stroke="#2e5a8f" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Left side labels (weekly digest) -->
  <text x="400" y="300" font-size="12" fill="#7c3aed" text-anchor="end" font-style="italic">weekly digest</text>
  
  <!-- Right side labels (daily standup) -->
  <text x="800" y="320" font-size="12" fill="#7c3aed" text-anchor="start" font-style="italic">daily standup</text>
  
  <!-- Bottom Left: Expense Tracker -->
  <g>
    <rect x="80" y="600" width="240" height="100" rx="20" fill="#5f3d1f" stroke="#9d6e3d" stroke-width="2"/>
    <text x="200" y="645" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Expense tracker</text>
    <text x="200" y="675" font-size="13" fill="#e8d4c4" text-anchor="middle">charts • budgets • CSV</text>
    <!-- Connection line -->
    <line x1="320" y1="650" x2="500" y2="450" stroke="#9d6e3d" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Bottom Center: Todo System -->
  <g>
    <rect x="480" y="620" width="240" height="100" rx="20" fill="#6b3a5f" stroke="#9d5f8f" stroke-width="2"/>
    <text x="600" y="665" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Todo system</text>
    <text x="600" y="695" font-size="13" fill="#e0c4d0" text-anchor="middle">4 categories • Pomodoro</text>
    <!-- Connection line -->
    <line x1="600" y1="620" x2="600" y2="480" stroke="#9d5f8f" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Bottom Right: Cloud Sync -->
  <g>
    <rect x="880" y="600" width="240" height="100" rx="20" fill="#3f3f3f" stroke="#6f6f6f" stroke-width="2"/>
    <text x="1000" y="645" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Cloud sync</text>
    <text x="1000" y="675" font-size="13" fill="#d4d4d4" text-anchor="middle">Supabase • QR pairing</text>
    <!-- Connection line -->
    <line x1="880" y1="650" x2="700" y2="450" stroke="#6f6f6f" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Feature dots/indicators -->
  <circle cx="600" cy="320" r="4" fill="#7c3aed" opacity="0.5"/>
  <circle cx="600" cy="480" r="4" fill="#7c3aed" opacity="0.5"/>
</svg>
  
  <!-- Feature dots/indicators -->
  <circle cx="600" cy="320" r="4" fill="#7c3aed" opacity="0.5"/>
  <circle cx="600" cy="480" r="4" fill="#7c3aed" opacity="0.5"/>
</svg>
  
  <!-- Expense Tracker (Bottom Left) -->
  <rect x="60" y="650" width="200" height="130" rx="15" fill="#5c3d1f" stroke="#8b5a2b" stroke-width="2"/>
  <text x="160" y="705" class="feature-title" text-anchor="middle" fill="#ffffff">Expense tracker</text>
  <text x="160" y="730" class="feature-desc" text-anchor="middle" fill="#daa520">charts · budgets · CSV</text>
  
  <!-- Todo System (Bottom Center) -->
  <rect x="410" y="650" width="200" height="130" rx="15" fill="#8b3a62" stroke="#c85a8e" stroke-width="2"/>
  <text x="510" y="705" class="feature-title" text-anchor="middle" fill="#ffffff">Todo system</text>
  <text x="510" y="730" class="feature-desc" text-anchor="middle" fill="#f0a0c0">4 categories · Pomodoro</text>
  
  <!-- Cloud Sync (Bottom Right) -->
  <rect x="760" y="650" width="200" height="130" rx="15" fill="#4a4a4a" stroke="#666" stroke-width="2"/>
  <text x="860" y="705" class="feature-title" text-anchor="middle" fill="#ffffff">Cloud sync</text>
  <text x="860" y="730" class="feature-desc" text-anchor="middle" fill="#cccccc">Supabase · QR pairing</text>
  
  <!-- Connections from Ash to bottom -->
  <!-- To Expense -->
  <path d="M 530 530 Q 400 590 260 650" stroke="#888" stroke-width="2" fill="none"/>
  
  <!-- To Todo -->
  <line x1="600" x2="510" y1="535" y2="650" stroke="#888" stroke-width="2"/>
  
  <!-- To Cloud -->
  <path d="M 670 530 Q 720 590 860 650" stroke="#888" stroke-width="2" fill="none"/>
</svg>
