    <text x="1000" y="335" font-size="12" fill="#a8c5e0" text-anchor="middle">Voice Input • Voice Output</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="350" y1="240" x2="450" y2="240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="240" x2="850" y2="240" stroke="#2d9b7e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom: Key Features -->
