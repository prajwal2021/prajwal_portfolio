      <text x="935" y="575" font-size="12" fill="white" text-anchor="middle">cross-device real-time</text>
      <text x="935" y="590" font-size="12" fill="white" text-anchor="middle">synchronization</text>
      <text x="935" y="610" font-size="12" fill="#999" text-anchor="middle">• 4 task categories</text>
      <text x="935" y="625" font-size="12" fill="#999" text-anchor="middle">• Pomodoro timer</text>
      <text x="935" y="640" font-size="12" fill="#999" text-anchor="middle">• Real-time sync</text>
      <text x="935" y="655" font-size="12" fill="#999" text-anchor="middle">• Cross-device sync</text>
      <text x="935" y="670" font-size="12" fill="#999" text-anchor="middle">• QR device pairing</text>
      <text x="935" y="685" font-size="12" fill="#999" text-anchor="middle">• Offline support</text>
      <text x="935" y="700" font-size="12" fill="#999" text-anchor="middle">• Auto-backup</text>
      <text x="935" y="715" font-size="12" fill="#999" text-anchor="middle">• Data recovery</text>
    </g>
  </g>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
  <text x="660" y="560" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Web Speech API</text>
  <text x="660" y="585" font-size="14" text-anchor="middle" fill="#f0a0c0">Voice input · browser-native</text>
  
  <!-- Connections from devices to core -->
  <line x1="140" y1="180" x2="380" y2="280" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="180" x2="420" y2="280" stroke="#666" stroke-width="2"/>
  
  <!-- Connections from core to storage -->
  <line x1="380" y1="400" x2="140" y2="520" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="220" y="460" font-size="12" fill="#999">cache</text>
  
  <line x1="400" y1="400" x2="400" y2="520" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="410" y="460" font-size="12" fill="#999">serves</text>
  
  <!-- Connections from core to external services -->
  <!-- To Supabase -->
  <line x1="600" y1="320" x2="820" y2="130" stroke="#888" stroke-width="2"/>
  <text x="680" y="210" font-size="12" fill="#999">sync</text>
  
  <!-- To Gemini -->
  <line x1="600" y1="340" x2="820" y2="330" stroke="#888" stroke-width="2"/>
  <text x="680" y="340" font-size="12" fill="#999">chat</text>
  
  <!-- To Canvas -->
  <line x1="600" y1="370" x2="820" y2="480" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="680" y="430" font-size="12" fill="#999">deadlines</text>
  
  <!-- To Web Speech -->
  <line x1="550" y1="400" x2="660" y2="520" stroke="#888" stroke-width="2"/>
  <text x="580" y="460" font-size="12" fill="#999">voice</text>
  
  <!-- Zero backend servers badge -->
  <rect x="980" y="680" width="180" height="50" rx="8" fill="none" stroke="#4caf50" stroke-width="2"/>
  <text x="1070" y="715" font-size="14" text-anchor="middle" fill="#4caf50" font-weight="bold">zero backend servers</text>
</svg>
