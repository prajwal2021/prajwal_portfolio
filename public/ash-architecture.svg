    <rect x="850" y="100" width="300" height="280" rx="15" fill="#0f3a5f" stroke="#2e5a8f" stroke-width="2"/>
    <text x="1000" y="135" font-size="20" font-weight="bold" fill="#a8c5e0" text-anchor="middle">AI & Integrations</text>
    
    <rect x="870" y="160" width="260" height="50" rx="8" fill="#081f38" stroke="#2e5a8f" stroke-width="1"/>
    <text x="1000" y="190" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Gemini 2.5 Flash</text>
    <text x="1000" y="205" font-size="12" fill="#a8c5e0" text-anchor="middle">AI Assistant • Context-Aware</text>
    
    <rect x="870" y="225" width="260" height="50" rx="8" fill="#081f38" stroke="#2e5a8f" stroke-width="1"/>
    <text x="1000" y="255" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Canvas LMS iCal API</text>
    <text x="1000" y="270" font-size="12" fill="#a8c5e0" text-anchor="middle">Deadline Sync • No Auth</text>
    
    <rect x="870" y="290" width="260" height="50" rx="8" fill="#081f38" stroke="#2e5a8f" stroke-width="1"/>
