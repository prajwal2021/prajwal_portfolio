      <text x="685" y="575" font-size="12" fill="white" text-anchor="middle">GPA projections with</text>
      <text x="685" y="590" font-size="12" fill="white" text-anchor="middle">AI-powered insights</text>
      <text x="685" y="610" font-size="12" fill="#999" text-anchor="middle">• Spending categories</text>
      <text x="685" y="625" font-size="12" fill="#999" text-anchor="middle">• Budget tracking</text>
      <text x="685" y="640" font-size="12" fill="#999" text-anchor="middle">• CSV export</text>
      <text x="685" y="655" font-size="12" fill="#999" text-anchor="middle">• Visual charts</text>
      <text x="685" y="670" font-size="12" fill="#999" text-anchor="middle">• GPA calculation</text>
      <text x="685" y="685" font-size="12" fill="#999" text-anchor="middle">• Grade projections</text>
      <text x="685" y="700" font-size="12" fill="#999" text-anchor="middle">• Goal-based alerts</text>
      <text x="685" y="715" font-size="12" fill="#999" text-anchor="middle">• Trend analysis</text>
    </g>
    
