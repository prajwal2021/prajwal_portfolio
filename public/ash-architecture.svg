    <rect x="50" y="450" width="1100" height="300" rx="15" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
    <text x="600" y="485" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Core Features</text>
    
    <g>
      <rect x="70" y="510" width="230" height="220" rx="10" fill="#3f3f3f" stroke="#666" stroke-width="1"/>
      <text x="185" y="535" font-size="16" font-weight="bold" fill="#00d4ff" text-anchor="middle">📅 Deadlines</text>
      <text x="185" y="560" font-size="12" fill="white" text-anchor="middle">Automatic Canvas</text>
      <text x="185" y="575" font-size="12" fill="white" text-anchor="middle">deadline sync with</text>
      <text x="185" y="590" font-size="12" fill="white" text-anchor="middle">urgency sorting</text>
      <text x="185" y="610" font-size="12" fill="#999" text-anchor="middle">• Deadline alerts</text>
      <text x="185" y="625" font-size="12" fill="#999" text-anchor="middle">• Priority ordering</text>
      <text x="185" y="640" font-size="12" fill="#999" text-anchor="middle">• Time-based reminders</text>
      <text x="185" y="655" font-size="12" fill="#999" text-anchor="middle">• Course organization</text>
      <text x="185" y="670" font-size="12" fill="#999" text-anchor="middle">• Urgency indicators</text>
      <text x="185" y="685" font-size="12" fill="#999" text-anchor="middle">• Weekly digest</text>
      <text x="185" y="700" font-size="12" fill="#999" text-anchor="middle">• Daily standup</text>
      <text x="185" y="715" font-size="12" fill="#999" text-anchor="middle">• AI suggestions</text>
    </g>
    
    <g>
      <rect x="320" y="510" width="230" height="220" rx="10" fill="#3f3f3f" stroke="#666" stroke-width="1"/>
      <text x="435" y="535" font-size="16" font-weight="bold" fill="#00ff88" text-anchor="middle">🤖 AI Assistant</text>
      <text x="435" y="560" font-size="12" fill="white" text-anchor="middle">Context-aware voice</text>
      <text x="435" y="575" font-size="12" fill="white" text-anchor="middle">and text conversations</text>
      <text x="435" y="590" font-size="12" fill="white" text-anchor="middle">with Gemini 2.5 Flash</text>
      <text x="435" y="610" font-size="12" fill="#999" text-anchor="middle">• Voice input & output</text>
      <text x="435" y="625" font-size="12" fill="#999" text-anchor="middle">• Context awareness</text>
      <text x="435" y="640" font-size="12" fill="#999" text-anchor="middle">• Personalized answers</text>
      <text x="435" y="655" font-size="12" fill="#999" text-anchor="middle">• Task prioritization</text>
      <text x="435" y="670" font-size="12" fill="#999" text-anchor="middle">• Budget suggestions</text>
      <text x="435" y="685" font-size="12" fill="#999" text-anchor="middle">• GPA projections</text>
      <text x="435" y="700" font-size="12" fill="#999" text-anchor="middle">• Daily recommendations</text>
      <text x="435" y="715" font-size="12" fill="#999" text-anchor="middle">• Weekly insights</text>
    </g>
    
    <g>
      <rect x="570" y="510" width="230" height="220" rx="10" fill="#3f3f3f" stroke="#666" stroke-width="1"/>
