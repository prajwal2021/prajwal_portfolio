<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#030014"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Ash - Technology Stack & Architecture</text>
  
  <!-- Frontend Section -->
  <g>
    <rect x="50" y="100" width="300" height="280" rx="15" fill="#2d1b69" stroke="#7c3aed" stroke-width="2"/>
    <text x="200" y="135" font-size="20" font-weight="bold" fill="#c4b5fd" text-anchor="middle">Frontend</text>
    
    <rect x="70" y="160" width="260" height="50" rx="8" fill="#1a0f3f" stroke="#7c3aed" stroke-width="1"/>
    <text x="200" y="190" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Vanilla JavaScript</text>
    <text x="200" y="205" font-size="12" fill="#c4b5fd" text-anchor="middle">HTML • CSS • No Framework</text>
    
    <rect x="70" y="225" width="260" height="50" rx="8" fill="#1a0f3f" stroke="#7c3aed" stroke-width="1"/>
    <text x="200" y="255" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Progressive Web App</text>
    <text x="200" y="270" font-size="12" fill="#c4b5fd" text-anchor="middle">Service Worker • Installable</text>
    
    <rect x="70" y="290" width="260" height="50" rx="8" fill="#1a0f3f" stroke="#7c3aed" stroke-width="1"/>
    <text x="200" y="320" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Offline-First</text>
    <text x="200" y="335" font-size="12" fill="#c4b5fd" text-anchor="middle">localStorage • Cache Management</text>
  </g>
  
  <!-- Backend & Storage Section -->
  <g>
    <rect x="450" y="100" width="300" height="280" rx="15" fill="#1a5f4f" stroke="#2d9b7e" stroke-width="2"/>
    <text x="600" y="135" font-size="20" font-weight="bold" fill="#b3e5d8" text-anchor="middle">Backend & Storage</text>
    
    <rect x="470" y="160" width="260" height="50" rx="8" fill="#0d3d33" stroke="#2d9b7e" stroke-width="1"/>
    <text x="600" y="190" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Supabase</text>
    <text x="600" y="205" font-size="12" fill="#b3e5d8" text-anchor="middle">PostgreSQL • Real-time Sync</text>
    
    <rect x="470" y="225" width="260" height="50" rx="8" fill="#0d3d33" stroke="#2d9b7e" stroke-width="1"/>
    <text x="600" y="255" font-size="14" font-weight="bold" fill="white" text-anchor="middle">GitHub Pages</text>
    <text x="600" y="270" font-size="12" fill="#b3e5d8" text-anchor="middle">Static Hosting • CDN</text>
    
    <rect x="470" y="290" width="260" height="50" rx="8" fill="#0d3d33" stroke="#2d9b7e" stroke-width="1"/>
    <text x="600" y="320" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Cloud Sync</text>
    <text x="600" y="335" font-size="12" fill="#b3e5d8" text-anchor="middle">Real-time Updates • QR Pairing</text>
  </g>
  
  <!-- AI & Integrations Section -->
